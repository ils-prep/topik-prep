<script>
  // ⚠️ Поменяй на реальный путь к твоей serverless-функции (generate-feedback.js)
  const FEEDBACK_API_URL = '/api/generate-feedback';

  document.addEventListener('DOMContentLoaded', async () => {
    const rawData = sessionStorage.getItem('topik_last_results');
    if (!rawData) {
      document.getElementById('ai-comment').textContent = "Данные теста не найдены. Пожалуйста, пройдите тест заново.";
      return;
    }

    const report = JSON.parse(rawData);
    const isTopik2 = report.examKey && report.examKey.includes('topik2');

    // Универсальная нормализация вопросов — поддержка разных названий полей
    const questionsData = (report.questions || report.answers || []).map((q) => {
      const userAnswer = q.userAnswer ?? q.selectedAnswer ?? null;
      const correctAnswer = q.correctAnswer ?? q.rightAnswer ?? null;
      // Правильно ТОЛЬКО если оба значения реально существуют и совпадают.
      // Пустой/отсутствующий ответ никогда не считается правильным.
      const isCorrect =
        typeof q.isCorrect === 'boolean'
          ? q.isCorrect
          : (userAnswer !== null && userAnswer !== '' && userAnswer === correctAnswer);

      return {
        title: q.title || q.question || q.text,
        userAnswer,
        correctAnswer,
        isCorrect
      };
    });

    const correctCount = questionsData.filter(q => q.isCorrect).length;
    const totalQuestions = questionsData.length;
    const percent = totalQuestions > 0 ? correctCount / totalQuestions : 0;
    const maxScale = isTopik2 ? 300 : 200;
    const finalScore = Math.round(percent * maxScale);

    let grade = "❌ Не сдан";
    if (isTopik2) {
      if (finalScore >= 230) grade = "6 급 (Высший)";
      else if (finalScore >= 190) grade = "5 급 (Продвинутый)";
      else if (finalScore >= 150) grade = "4 급 (Средний)";
      else if (finalScore >= 120) grade = "3 급 (Порог Профессионального)";
    } else {
      if (finalScore >= 140) grade = "2 급 (Базовый)";
      else if (finalScore >= 80) grade = "1 급 (Элементарный)";
    }

    document.getElementById('correct-ratio').textContent = `${correctCount} / ${totalQuestions}`;
    document.getElementById('calculated-score').textContent = `${finalScore} / ${maxScale}`;
    document.getElementById('grade-level').textContent = grade;

    const aiTextEl = document.getElementById('ai-comment');
    const listContainer = document.getElementById('questions-list');

    if (totalQuestions === 0) {
      listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Детальные данные по вопросам недоступны.</p>';
      aiTextEl.textContent = 'Нет данных для анализа.';
      return;
    }

    // Рендерим вопросы сразу (без объяснений — они подгрузятся следующим шагом)
    function renderQuestions(explanationByIndex = {}) {
      listContainer.innerHTML = '';
      questionsData.forEach((q, index) => {
        const cardClass = q.isCorrect ? 'correct' : 'incorrect';
        const badgeClass = q.isCorrect ? 'badge-success' : 'badge-error';
        const badgeText = q.isCorrect ? 'Правильно' : 'Ошибка';
        const userAnswerText = q.userAnswer || 'Нет ответа';
        const correctAnswerText = q.correctAnswer || 'Не указан';
        const explanationText = explanationByIndex[index + 1]
          || (q.isCorrect ? '' : 'Загружаю AI-разбор...');

        const questionCard = document.createElement('div');
        questionCard.className = `question-item ${cardClass}`;
        questionCard.innerHTML = `
          <div class="q-header">
            <span class="q-number">Вопрос №${index + 1}</span>
            <span class="q-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="q-title">${q.title || `Вопрос ${index + 1}`}</div>
          <div class="answers-comparison">
            <div class="ans-row">
              <span class="ans-label">Ваш ответ:</span>
              <span class="ans-val ${q.isCorrect ? 'user-correct' : 'user-wrong'}">${userAnswerText}</span>
            </div>
            ${!q.isCorrect ? `
            <div class="ans-row">
              <span class="ans-label">Правильный ответ:</span>
              <span class="ans-val correct-ans">${correctAnswerText}</span>
            </div>` : ''}
          </div>
          ${explanationText ? `
          <div class="q-explanation">
            <strong>💡 AI Пояснение:</strong> ${explanationText}
          </div>` : ''}
        `;
        listContainer.appendChild(questionCard);
      });
    }

    renderQuestions();

    // ЗАПРОС РЕАЛЬНОГО AI-ФИДБЕКА
    try {
      const response = await fetch(FEEDBACK_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          examKey: report.examKey,
          correctCount,
          totalQuestions,
          questions: questionsData
        })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);
      const data = await response.json();

      aiTextEl.innerHTML = data.overallFeedback || 'Не удалось получить общий отзыв ИИ.';

      const explanationByIndex = {};
      (data.questionFeedback || []).forEach(fb => {
        explanationByIndex[fb.index] = fb.explanation;
      });
      renderQuestions(explanationByIndex);

    } catch (err) {
      console.error('Feedback fetch error:', err);
      aiTextEl.textContent = 'Не удалось загрузить AI-анализ. Попробуйте обновить страницу.';
      renderQuestions();
    }
  });
</script>
