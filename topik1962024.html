<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Официальный симулятор TOPIK I · 96-й выпуск</title>
  <style>
    :root {
      --bg: #05070f;
      --card-bg: rgba(13, 18, 33, 0.75);
      --border: rgba(168, 85, 247, 0.2);
      --text: #f3f4f6;
      --text-muted: #8892b0;
      --purple: #a855f7;
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
    body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 40px 20px; }
    .container { max-width: 850px; margin: 0 auto; }

    .test-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 40px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

    .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .timer-badge { background: rgba(6, 182, 212, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 14px; border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .audio-player-container {
      background: rgba(6, 182, 212, 0.06); border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 16px; padding: 18px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; gap: 15px;
    }
    .audio-info { display: flex; flex-direction: column; gap: 4px; }
    .audio-label { font-size: 0.8rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.5px; }
    .audio-status { font-size: 0.9rem; color: var(--text-muted); }

    .play-tts-btn {
      background: linear-gradient(135deg, var(--cyan), #0891b2); color: #000; border: none;
      padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }
    .play-tts-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .play-tts-btn:disabled { background: #27272a; color: #71717a; cursor: not-allowed; box-shadow: none; }

    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); width: 0%; }

    .q-meta { font-size: 0.85rem; color: var(--purple); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .q-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 30px; line-height: 1.6; color: #fff; white-space: pre-line; }

    .options-group { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .option-btn {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 18px 22px; text-align: left; color: var(--text); font-size: 1.05rem; font-weight: 500; cursor: pointer;
    }
    .option-btn:hover { background: rgba(168, 85, 247, 0.08); border-color: rgba(168, 85, 247, 0.4); }
  </style>
</head>
<body>

  <main class="container">
    <div class="test-card">
      <div class="test-header">
        <div class="q-meta" id="exam-title">TOPIK I · 96-й выпуск</div>
        <div class="timer-badge" id="timer">100:00</div>
      </div>

      <div id="audio-zone" style="display: none;">
        <div class="audio-player-container">
          <div class="audio-info">
            <div class="audio-label">🎧 Аудирование (듣기)</div>
            <div class="audio-status" id="tts-status">Нажмите кнопку для прослушивания диалога</div>
          </div>
          <button class="play-tts-btn" id="tts-trigger-btn">▶ Слушать аудио</button>
        </div>
      </div>

      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="q-meta" id="q-number">Задание 1</div>
      <div class="q-text" id="q-text">Загрузка вопросов...</div>

      <div id="interaction-zone"></div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      // База данных заданий на основе официального 96-го экзамена TOPIK I (Аудирование и Чтение)
      const questions = [
        // --- АУДИРОВАНИЕ (듣기 1-30) ---
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q1',
          text: '[1번] 남자의 말을 듣고 알맞은 대답을 고르십시오.\n\n남자: 모자가 많아요?',
          speechText: "모자가 많아요?",
          options: ['① 네, 모자가 없어요[cite: 103].', '② 아니요, 모자예요[cite: 103].', '③ 네, 모자가 많아요[cite: 103].', '④ 아니요, 모자가 싸요[cite: 103].'],
          answer: 3
        },
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q2',
          text: '[2번] 여자의 말을 듣고 알맞은 대답을 고르십시오.\n\n여자: 커피를 좋아해요?',
          speechText: "커피를 좋아해요?",
          options: ['① 네, 커피가 싫어요[cite: 103].', '② 아니요, 커피를 마셔요[cite: 103].', '③ 네, 커피가 아니에요[cite: 103].', '④ 아니요, 커피를 안 좋아해요[cite: 103].'],
          answer: 4
        },
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q3',
          text: '[3번] 남자의 말을 듣고 알맞은 대답을 고르십시오.\n\n남자: 몇 시에 공항에 가요?',
          speechText: "몇 시에 공항에 가요?",
          options: ['① 혼자 가요[cite: 103].', '② 동생이 가요[cite: 103].', '③ 걸어서 가요[cite: 103].', '④ 한 시에 가요[cite: 103].'],
          answer: 4
        },
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q7',
          text: '[7번] 어디에서 이야기하고 있습니까? 알맞은 것을 고르십시오.\n\n남자: 이 장미는 얼마예요?\n여자: 한 송이에 이천 원입니다, 손님.',
          speechText: "이 장미는 얼마예요? 한 송이에 이천 원입니다, 손님.",
          options: ['① 학교[cite: 105]', '② 꽃집[cite: 105]', '③ 미용실[cite: 105]', '④ 사진관[cite: 105]'],
          answer: 2
        },
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q11',
          text: '[11번] 다음은 무엇에 대해 말하고 있습니까?\n\n남자: 안녕하세요? 저는 김민수입니다.\n여자: 저는 이지영입니다.',
          speechText: "안녕하세요? 저는 김민수입니다. 저는 이지영입니다.",
          options: ['① 시간[cite: 106]', '② 나이[cite: 106]', '③ 이름[cite: 106]', '④ 요일[cite: 106]'],
          answer: 3
        },
        {
          type: 'choice',
          section: '듣기 (Слушание) — Q17',
          text: '[17번] 대화 내용과 같은 것을 고르십시오.\n\n여자: 내일 시험 끝나고 주말에 뭐 할 거예요?\n남자: 부모님을 만나러 고향에 가려고 해요. 수미 씨는요?\n여자: 전 그냥 집에서 책도 보고 푹 쉬려고요.',
          speechText: "내일 시험 끝나고 주말에 뭐 할 거예요? 부모님을 만나러 고향에 가려고 해요. 수미 씨는요? 전 그냥 집에서 책도 보고 푹 쉬려고요.",
          options: [
            '① 남자는 지금 고향에 있습니다[cite: 108].',
            '② 여자는 내일 시험이 없습니다[cite: 108].',
            '③ 남자는 오늘 부모님을 만날 겁니다[cite: 108].',
            '④ 여자는 주말에 집에서 쉬려고 합니다[cite: 108].'
          ],
          answer: 4
        },

        // --- ЧТЕНИЕ (읽기 31-70) ---
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q31',
          text: '[31번] 무엇에 대한 내용입니까? 알맞은 것을 고르십시오.\n\n"저는 영국 사람입니다. 친구는 중국 사람입니다."',
          options: ['① 가족[cite: 127]', '② 날짜[cite: 127]', '③ 나라[cite: 127]', '④ 학교[cite: 127]'],
          answer: 3
        },
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q32',
          text: '[32번] 무엇에 대한 내용입니까? 알맞은 것을 고르십시오.\n\n"민수 씨는 의사입니다. 병원에서 일합니다."',
          options: ['① 요일[cite: 127]', '② 여행[cite: 127]', '③ 취미[cite: 127]', '④ 직업[cite: 127]'],
          answer: 4
        },
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q34',
          text: '[34번] 빈칸에 들어갈 가장 알맞은 것을 고르십시오.\n\n"( )에 갑니다. 책을 삽니다."',
          options: ['① 은행[cite: 128]', '② 극장[cite: 128]', '③ 서점[cite: 128]', '④ 식당[cite: 128]'],
          answer: 3
        },
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q40',
          text: '[40번] 다음을 읽고 맞지 않는 것을 고르십시오.\n\n[1,000원의 아침밥]\n• 기간: 2024년 9월~12월\n• 일시: 월~금 08:00~09:00\n• 장소: 학생 식당\n• 가격: 1,000원\n※ 인주대학교 학생만 이용할 수 있습니다.',
          options: [
            '① 천 원에 팝니다[cite: 129].',
            '② 구월까지 합니다[cite: 129].',
            '③ 주말에는 못 먹습니다[cite: 129].',
            '④ 학생 식당에서 먹습니다[cite: 129].'
          ],
          answer: 2
        },
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q43',
          text: '[43번] 다음을 읽고 내용이 같은 것을 고르십시오.\n\n"우리 집 근처에 빵집이 하나 있습니다. 그 빵집은 케이크가 싸고 맛있습니다. 저는 케이크를 좋아해서 거기에 자주 갑니다."',
          options: [
            '① 빵집이 집에서 멉니다[cite: 131].',
            '② 저는 빵집에 자주 갑니다[cite: 131].',
            '③ 저는 케이크를 싫어합니다[cite: 131].',
            '④ 케이크가 비싸지만 맛있습니다[cite: 131].'
          ],
          answer: 2
        },
        {
          type: 'choice',
          section: '읽기 (Чтение) — Q46',
          text: '[46번] 다음을 읽고 중심 내용을 고르십시오.\n\n"저는 얼마 전에 테니스를 시작했습니다. 테니스를 치면 즐겁고 기분이 좋습니다. 그래서 매일 테니스를 치러 갑니다."',
          options: [
            '① 저는 테니스를 배우려고 합니다[cite: 132].',
            '② 저는 테니스 치는 것을 좋아합니다[cite: 132].',
            '③ 저는 테니스 경기를 보고 싶습니다[cite: 132].',
            '④ 저는 친구와 테니스를 치면 좋겠습니다[cite: 132].'
          ],
          answer: 2
        }
      ];

      let currentIdx = 0;
      let timeLeft = 100 * 60; // 100 минут на TOPIK I
      const userAnswers = new Array(questions.length).fill(null);

      function speakKoreanText(text) {
        if (!('speechSynthesis' in window)) {
          alert('Ваш браузер не поддерживает синтез речи.');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.85;

        const statusEl = document.getElementById('tts-status');
        const btn = document.getElementById('tts-trigger-btn');

        utterance.onstart = () => { statusEl.textContent = '🔊 Воспроизведение аудио...'; btn.disabled = true; };
        utterance.onend = () => { statusEl.textContent = '✅ Прослушано. Выберите вариант ответа.'; btn.disabled = false; };
        utterance.onerror = () => { statusEl.textContent = '❌ Ошибка воспроизведения звука.'; btn.disabled = false; };

        window.speechSynthesis.speak(utterance);
      }

      function startTimer() {
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
          if (timeLeft <= 0) { clearInterval(interval); finishExam(); return; }
          timeLeft--;
          const mins = Math.floor(timeLeft / 60);
          const secs = timeLeft % 60;
          timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
      }

      function renderQuestion() {
        if (currentIdx >= questions.length) { finishExam(); return; }
        window.speechSynthesis.cancel();

        const q = questions[currentIdx];

        document.getElementById('progress').style.width = `${(currentIdx / questions.length) * 100}%`;
        document.getElementById('exam-title').textContent = `TOPIK I (96-й выпуск) · ${q.section}`;
        document.getElementById('q-number').textContent = `Задание ${currentIdx + 1} из ${questions.length}`;
        document.getElementById('q-text').textContent = q.text;

        const audioZone = document.getElementById('audio-zone');
        const btn = document.getElementById('tts-trigger-btn');
        const statusEl = document.getElementById('tts-status');

        if (q.speechText) {
          audioZone.style.display = 'block';
          statusEl.textContent = 'Нажмите кнопку для прослушивания';
          btn.disabled = false;
          btn.onclick = () => speakKoreanText(q.speechText);
        } else {
          audioZone.style.display = 'none';
        }

        const zone = document.getElementById('interaction-zone');
        zone.innerHTML = '';

        const wrapper = document.createElement('div');
        wrapper.className = 'options-group';
        q.options.forEach((opt, index) => {
          const btnOpt = document.createElement('button');
          btnOpt.className = 'option-btn';
          btnOpt.textContent = opt;
          btnOpt.onclick = () => saveChoiceAnswer(index + 1);
          wrapper.appendChild(btnOpt);
        });
        zone.appendChild(wrapper);
      }

      function saveChoiceAnswer(selectedOption) {
        userAnswers[currentIdx] = selectedOption;
        currentIdx++;
        renderQuestion();
      }

      function finishExam() {
        window.speechSynthesis.cancel();
        let correctCount = 0;
        questions.forEach((q, idx) => {
          if (Number(userAnswers[idx]) === Number(q.answer)) correctCount++;
        });

        const percentage = Math.round((correctCount / questions.length) * 100);
        
        const card = document.querySelector('.test-card');
        card.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <h2 style="color: var(--cyan); margin-bottom: 15px; font-size: 1.8rem;">🎉 Тест (96-й выпуск) завершен!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 10px;">Правильных ответов: <b>${correctCount} из ${questions.length}</b></p>
            <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 25px;">Ваш результат: <b>${percentage}%</b></p>
            <button class="play-tts-btn" style="margin: 0 auto;" onclick="window.location.reload()">Пройти тест заново</button>
          </div>
        `;
      }

      document.addEventListener('DOMContentLoaded', () => { startTimer(); renderQuestion(); });
    })();
  </script>
</body>
</html>
